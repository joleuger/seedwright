<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — {{ .Title }}</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;display:flex;align-items:center;justify-content:center;min-height:100vh}
        .error{background:#16213e;border:1px solid #e94560;padding:2rem;border-radius:8px;max-width:500px;text-align:center}
        .error h2{color:#e94560;margin-bottom:1rem}
        .error p{color:#a0a0b0;margin-bottom:1.5rem}
        .error .btn{background:#e94560;color:#fff;padding:0.5rem 1rem;border-radius:4px;text-decoration:none;display:inline-block}
        .error .btn:hover{background:#c73652}
    </style>
</head>
<body>
    <div class="error">
        <h2>Error</h2>
        <p>{{ .Error }}</p>
        {{ if .Project }}<a href="{{ urlPath (print "/basic/" .Project) }}">Dashboard</a>{{ else }}<a href="{{ urlPath "/" }}">Home</a>{{ end }}
    </div>
</body>
</html>
