<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow — {{ .Project }}</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;background:#000;overflow:hidden}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e0e0e0}
        #stage{position:fixed;inset:0;display:none;align-items:center;justify-content:center;cursor:pointer}
        #slideImage{max-width:100vw;max-height:calc(100vh - 7.5rem);object-fit:contain;display:block}
        #topbar{position:fixed;top:0;left:0;right:0;display:none;align-items:center;gap:0.75rem;padding:0.6rem 1rem;background:linear-gradient(rgba(0,0,0,0.75),transparent);z-index:2}
        #topbar .title{color:#a0a0b0;font-size:0.8rem;letter-spacing:0.06em}
        #counter{color:#e94560;font-size:0.85rem;font-weight:600;margin-left:auto}
        .ctrl-btn{background:rgba(22,33,62,0.85);border:1px solid #0f3460;color:#e0e0e0;padding:0.35rem 0.7rem;border-radius:4px;cursor:pointer;font-size:0.9rem;line-height:1}
        .ctrl-btn:hover{border-color:#e94560;color:#fff}
        #bottom{position:fixed;bottom:0;left:0;right:0;display:none;padding:0.5rem 1rem 0.75rem;background:linear-gradient(transparent,rgba(0,0,0,0.85));z-index:2}
        #caption{font-size:0.8rem;color:#a0a0b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:0.5rem;min-height:1.1em}
        #progressTrack{height:3px;background:rgba(255,255,255,0.12);border-radius:2px;overflow:hidden}
        #progressBar{height:100%;width:0;background:#e94560}
        #state{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0.75rem;color:#a0a0b0;font-size:1rem;text-align:center;padding:2rem}
        #state .hint{font-size:0.8rem;color:#555}
        #emptyBack{display:none;background:#e94560;color:#fff;border:none;padding:0.6rem 1.2rem;border-radius:4px;cursor:pointer;font-size:0.9rem}
        body.ready #stage{display:flex}
        body.ready #topbar{display:flex}
        body.ready #bottom{display:block}
        body.ready #state{display:none}
    </style>
</head>
<body>
    <div id="state">
        <span id="stateMessage">Loading slideshow…</span>
        <span class="hint">Space = play/pause · ← → = step · Esc = back to gallery</span>
    </div>
    <button id="emptyBack">← Back to gallery</button>

    <div id="topbar">
        <span class="title">SLIDESHOW — {{ .Project }}</span>
        <span id="counter"></span>
        <button id="playPauseBtn" class="ctrl-btn" title="Play / pause (space)">⏸</button>
        <button id="exitBtn" class="ctrl-btn" title="Back to gallery (Esc)">✕</button>
    </div>

    <div id="stage"><img id="slideImage" alt=""></div>

    <div id="bottom">
        <div id="caption"></div>
        <div id="progressTrack"><div id="progressBar"></div></div>
    </div>

    <script>
    (function() {
        var PROJECT = '{{ .Project }}';
        var PREFIX = '{{ .prefix }}';
        // Gallery filters inherited from the entry URL (favorites, sort,
        // order, origin, extension filters — pagination stripped server-side).
        var INHERITED = '{{ .InheritedQuery }}';

        var SLIDE_INTERVAL_MS = 4000; // fixed default — no settings surface
        var MAX_SLIDES = 500;         // queue cap for large filtered sets

        var slides = [];
        var index = 0;
        var playing = false;
        var rafId = null;
        var progressStart = 0;
        var misses = 0;

        var stage = document.getElementById('stage');
        var img = document.getElementById('slideImage');
        var counter = document.getElementById('counter');
        var caption = document.getElementById('caption');
        var bar = document.getElementById('progressBar');
        var stateEl = document.getElementById('stateMessage');
        var emptyBack = document.getElementById('emptyBack');
        var playBtn = document.getElementById('playPauseBtn');

        function url(path) { return PREFIX + path; }

        function galleryURL() {
            return url('/basic/' + PROJECT + '/gallery') + (INHERITED ? '?' + INHERITED : '');
        }

        function elementURL(i) {
            return url('/basic/' + PROJECT + '/element/' + slides[i].id + '/image');
        }

        function showState(msg, isError) {
            stateEl.textContent = msg;
            stateEl.style.color = isError ? '#e94560' : '#a0a0b0';
        }

        function render() {
            var el = slides[index];
            img.src = elementURL(index);
            img.onerror = null; // re-attach below so a cached failure re-fires
            img.onerror = onImageError;
            counter.textContent = (index + 1) + ' / ' + slides.length;

            var parts = [];
            if (el.generation && el.generation.prompt) {
                var p = el.generation.prompt;
                parts.push(p.length > 140 ? p.slice(0, 137) + '…' : p);
            }
            if (el.generation && typeof el.generation.seed !== 'undefined') {
                parts.push('seed ' + el.generation.seed);
            }
            if (el.model_name) parts.push(el.model_name);
            if (el.created_at) parts.push(el.created_at.slice(0, 10));
            caption.textContent = parts.join('  ·  ');

            // Preload the next slide so the advance is seamless.
            var pre = new Image();
            pre.src = elementURL((index + 1) % slides.length);
        }

        function onImageError() {
            // Missing image (deleted from S3, not yet synced) — skip it.
            // If every slide is missing, stop instead of looping fast.
            misses++;
            if (slides.length === 0) return;
            if (misses >= slides.length) {
                playing = false;
                stopTimer();
                showState('No images available for these elements.', true);
                document.body.classList.remove('ready');
                return;
            }
            if (playing) go(1);
        }

        img.onload = function() { misses = 0; };

        function tick() {
            var elapsed = Date.now() - progressStart;
            bar.style.width = Math.min(100, (elapsed / SLIDE_INTERVAL_MS) * 100) + '%';
            if (elapsed >= SLIDE_INTERVAL_MS) {
                go(1);
                return;
            }
            rafId = requestAnimationFrame(tick);
        }

        function startTimer() {
            stopTimer();
            progressStart = Date.now();
            rafId = requestAnimationFrame(tick);
            playBtn.textContent = '⏸';
        }

        function stopTimer() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
            playBtn.textContent = '▶';
        }

        function go(delta) {
            if (slides.length === 0) return;
            index = (index + delta + slides.length) % slides.length;
            render();
            if (playing) startTimer();
        }

        function toggle() {
            if (slides.length === 0) return;
            playing = !playing;
            if (playing) {
                startTimer();
            } else {
                stopTimer();
                bar.style.width = '0%';
            }
        }

        img.onclick = function() {
            window.location.href = url('/basic/' + PROJECT + '/element/' + slides[index].id);
        };

        playBtn.onclick = function() { toggle(); };
        document.getElementById('exitBtn').onclick = function() {
            window.location.href = galleryURL();
        };
        emptyBack.onclick = function() {
            window.location.href = galleryURL();
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                window.location.href = galleryURL();
            } else if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                toggle();
            } else if (e.key === 'ArrowRight') {
                go(1);
            } else if (e.key === 'ArrowLeft') {
                go(-1);
            }
        });

        fetch(url('/api/' + PROJECT + '/elements?per_page=' + MAX_SLIDES + (INHERITED ? '&' + INHERITED : '')))
            .then(function(r) {
                if (!r.ok) throw new Error('failed to load queue (' + r.status + ')');
                return r.json();
            })
            .then(function(data) {
                slides = data.elements || [];
                if (slides.length === 0) {
                    showState('No images match the current filters.', false);
                    emptyBack.style.display = 'inline-block';
                    return;
                }
                document.body.classList.add('ready');
                playing = true;
                render();
                startTimer();
            })
            .catch(function(err) {
                showState('Failed to load slideshow: ' + err.message, true);
            });
    })();
    </script>
</body>
</html>
